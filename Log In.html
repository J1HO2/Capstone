<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IGP SmartStock - Login</title>
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Poppins", sans-serif;
      background: url("background.jpg") no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      color: #222;
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
      position: relative;
      padding-top: 280px;
      padding-left: 230px;
    }

    /* Soft white overlay for readability */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.3);
      z-index: 0;
    }

    /* Login container */
    .login-side {
      position: relative;
      z-index: 1;
      width: 420px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      padding: 40px 35px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      border: 2px solid #FFD700;
      text-align: left;
    }

    /* Logo + Title */
    .brand-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .logo {
      width: 70px;
      height: 70px;
      object-fit: contain;
      border-radius: 10px;
    }

    .brand-header h1 {
      color: #e6b800;
      font-size: 36px;
      margin: 0;
    }

    h3 {
      color: #333;
      font-weight: normal;
      margin-bottom: 25px;
      font-size: 15px;
      line-height: 1.4;
    }

    label {
      display: block;
      font-size: 14px;
      color: #333;
      margin-bottom: 6px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      color: #000;
      font-size: 15px;
      outline: none;
      transition: 0.3s;
    }

    input:focus {
      border-color: #FFD700;
      box-shadow: 0 0 5px #FFD700;
    }

    .helper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 20px;
      color: #555;
    }

    .helper a {
      color: #e6b800;
      text-decoration: none;
    }

    .helper a:hover {
      text-decoration: underline;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background-color: #FFD700;
      color: #000;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
      font-size: 15px;
    }

    .btn:hover {
      background-color: #e6c200;
    }

    /* Google Sign-In Button */
    .btn-google {
      width: 100%;
      padding: 12px;
      background-color: #fff;
      color: #333;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .btn-google:hover {
      background-color: #f8f9fa;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .btn-google svg {
      width: 20px;
      height: 20px;
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 25px 0;
      color: #666;
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #ddd;
    }

    .divider span {
      padding: 0 10px;
    }

    p {
      text-align: left;
      margin-top: 20px;
      font-size: 13px;
      color: #333;
    }

    p a {
      color: #e6b800;
      text-decoration: none;
    }

    p a:hover {
      text-decoration: underline;
    }

    @media (max-width: 900px) {
      body {
        justify-content: center;
        align-items: center;
        padding: 0;
      }
      .login-side {
        width: 100%;
        max-width: 380px;
        text-align: center;
      }
      .brand-header {
        justify-content: center;
      }
    }
  </style>
</head>

<body>
  <div class="overlay"></div>

  <div class="login-side">
    <div class="brand-header">
      <img src="logo.png" alt="IGP SmartStock Logo" class="logo">
      <h1>IGP SmartStock</h1>
    </div>

    <h3>Welcome back! Sign in to manage your inventory and operations efficiently.</h3>

    <!-- Google Sign-In Button -->
    <button type="button" class="btn-google" id="googleSignInBtn">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        <path fill="none" d="M0 0h48v48H0z"/>
      </svg>
      Continue with Google
    </button>

    <div class="divider">
      <span>OR</span>
    </div>

    <form id="loginForm">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="you@example.com" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Your password" required>

      <div class="helper">
        <label><input type="checkbox" id="remember"> Remember Me</label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit" class="btn">Log In</button>
    </form>

    <p>Don't have an account? <a href="Registration.html">Create one</a></p>
  </div>

  <!-- Supabase Authentication -->
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
    import { SUPABASE_CONFIG } from "./config/credentials.js";

    const supabase = createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);

    // Google Sign-In Handler
    const googleSignInBtn = document.getElementById("googleSignInBtn");
    googleSignInBtn.addEventListener("click", async () => {
      const { data, error } = await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: `${window.location.origin}/main.html`,
          queryParams: {
            access_type: 'offline',
            prompt: 'consent',
          }
        }
      });

      if (error) {
        Swal.fire({
          icon: "error",
          title: "Google Sign-In Failed",
          text: error.message || "Unable to connect with Google.",
          confirmButtonColor: "#FFD700",
        });
      }
    });

    // Check for OAuth callback and handle session
    supabase.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_IN' && session) {
        const user = session.user;
        
        // Store user session information
        localStorage.setItem("userEmail", user.email);
        localStorage.setItem("userId", user.id);
        localStorage.setItem("isLoggedIn", "true");
        
        // Store user profile data
        if (user.user_metadata) {
          localStorage.setItem("userFullName", user.user_metadata.full_name || user.user_metadata.name || "");
          localStorage.setItem("userOfficeUnit", user.user_metadata.office_unit || "");
        }

        Swal.fire({
          icon: "success",
          title: "Login Successful",
          text: `Welcome back, ${user.user_metadata?.full_name || user.user_metadata?.name || user.email}!`,
          timer: 1500,
          showConfirmButton: false,
          background: "#fff",
          color: "#000",
          didClose: () => {
            window.location.href = "main.html";
          },
        });
      }
    });

    const form = document.getElementById("loginForm");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        Swal.fire({
          icon: "warning",
          title: "Missing Fields",
          text: "Please fill in both email and password.",
          confirmButtonColor: "#FFD700",
        });
        return;
      }

      // Sign in with Supabase Authentication
      const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        Swal.fire({
          icon: "error",
          title: "Login Failed",
          text: error.message || "Invalid email or password.",
          confirmButtonColor: "#FFD700",
        });
        return;
      }

      // Store user session information
      const user = data.user;
      localStorage.setItem("userEmail", user.email);
      localStorage.setItem("userId", user.id);
      localStorage.setItem("isLoggedIn", "true");
      
      // Store user profile data if available
      if (user.user_metadata) {
        localStorage.setItem("userFullName", user.user_metadata.full_name || "");
        localStorage.setItem("userOfficeUnit", user.user_metadata.office_unit || "");
      }

      Swal.fire({
        icon: "success",
        title: "Login Successful",
        text: `Welcome back, ${user.user_metadata?.full_name || user.email}!`,
        timer: 1500,
        showConfirmButton: false,
        background: "#fff",
        color: "#000",
        didClose: () => {
          window.location.href = "main.html";
        },
      });
    });
  </script>
</body>
</html>

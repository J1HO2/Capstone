<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IGP SmartStock - Registration</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      font-family:"Poppins",sans-serif;
      background:url("background.jpg") no-repeat center center fixed;
      background-size:cover;
      height:100vh;
      display:flex;
      align-items:flex-start;
      justify-content:flex-start;
      padding-top:270px;
      padding-left:220px;
      position:relative;
    }
    .overlay{
      position:absolute;
      top:0;left:0;width:100%;height:100%;
      background:rgba(255,255,255,0.3);z-index:0;
    }
    .register-box{
      position:relative;z-index:1;
      width:450px;background:rgba(255,255,255,0.9);
      border-radius:12px;padding:40px;
      box-shadow:0 8px 20px rgba(0,0,0,0.2);
      border:2px solid #FFD700;
    }
    .brand-header{display:flex;align-items:center;gap:10px;margin-bottom:15px;}
    .logo{width:65px;height:65px;object-fit:contain;border-radius:10px;}
    .brand-header h1{color:#e6b800;font-size:32px;margin:0;}
    h3{color:#333;margin-bottom:20px;font-weight:normal;}
    label{display:block;margin-bottom:5px;font-size:14px;color:#333;}
    input,select{
      width:100%;padding:10px;margin-bottom:15px;
      border:1px solid #ccc;border-radius:6px;font-size:15px;
    }
    input:focus,select:focus{border-color:#FFD700;box-shadow:0 0 5px #FFD700;outline:none;}
    .btn{
      width:100%;padding:12px;background:#FFD700;color:#000;
      border:none;border-radius:6px;font-weight:bold;cursor:pointer;
      transition:background .3s;font-size:15px;
    }
    .btn:hover{background:#e6c200;}
    .btn-secondary{background:#ccc;color:#000;}
    .btn-secondary:hover{background:#bbb;}
    .btn-google{
      width:100%;padding:12px;background:#fff;color:#333;
      border:1px solid #ddd;border-radius:6px;font-weight:500;
      cursor:pointer;transition:all .3s;font-size:15px;
      display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:20px;
    }
    .btn-google:hover{background:#f8f9fa;box-shadow:0 2px 8px rgba(0,0,0,0.1);}
    .btn-google svg{width:20px;height:20px;}
    .divider{
      display:flex;align-items:center;text-align:center;
      margin:25px 0;color:#666;font-size:13px;
    }
    .divider::before,.divider::after{content:'';flex:1;border-bottom:1px solid #ddd;}
    .divider span{padding:0 10px;}
    .step{display:none;}
    .step.active{display:block;}
    p{text-align:left;margin-top:15px;font-size:13px;}
    p a{color:#e6b800;text-decoration:none;}
    p a:hover{text-decoration:underline;}
  </style>
</head>
<body>
  <div class="overlay"></div>

  <div class="register-box">
    <div class="brand-header">
      <img src="logo.png" alt="IGP SmartStock Logo" class="logo">
      <h1>IGP SmartStock</h1>
    </div>
    <h3>Create your account to start managing your inventory and records.</h3>

    <!-- Google Sign-Up Button -->
    <button type="button" class="btn-google" id="googleSignUpBtn">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        <path fill="none" d="M0 0h48v48H0z"/>
      </svg>
      Sign up with Google
    </button>

    <div class="divider">
      <span>OR</span>
    </div>

    <form id="registerForm">
      <!-- STEP 1 -->
      <div class="step active" id="step1">
        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" placeholder="Enter your full name" required>

        <label for="age">Employee ID</label>
        <input type="number" id="age" placeholder="Enter your employee ID" required>

        <label for="office_unit">Office / Unit</label>
        <input type="text" id="office_unit" placeholder="Enter your office or unit" required>

        <label for="position">Teaching / Non-Teaching</label>
        <select id="position" title="Teaching / Non-Teaching" required>
          <option value="">Select</option>
          <option value="Teaching">Teaching</option>
          <option value="Non-Teaching">Non-Teaching</option>
        </select>

        <button type="button" class="btn" id="next1">Next</button>
      </div>

      <!-- STEP 2 -->
      <div class="step" id="step2">
        <label>Birthday</label>
        <input type="date" id="birthday" required>

        <label>Contact Details</label>
        <input type="text" id="contact" placeholder="09XXXXXXXXX" required>

        <label>Email Address</label>
        <input type="email" id="email" required>

        <label>Password</label>
        <input type="password" id="password" required>

        <button type="button" class="btn-secondary btn" id="back1">Back</button>
        <button type="submit" class="btn">Create Account</button>
      </div>
    </form>

    <p>Already have an account? <a href="Log In.html">Sign in here</a></p>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
    import { SUPABASE_CONFIG } from "./config/credentials.js";

    const supabase = createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);

    // Google Sign-Up Handler
    const googleSignUpBtn = document.getElementById("googleSignUpBtn");
    googleSignUpBtn.addEventListener("click", async () => {
      const { data, error } = await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: `${window.location.origin}/main.html`,
          queryParams: {
            access_type: 'offline',
            prompt: 'consent',
          }
        }
      });

      if (error) {
        Swal.fire({
          icon: "error",
          title: "Google Sign-Up Failed",
          text: error.message || "Unable to connect with Google.",
          confirmButtonColor: "#FFD700",
        });
      }
    });

    // Check for OAuth callback and handle session
    supabase.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_IN' && session) {
        const user = session.user;
        
        // Store user session information
        localStorage.setItem("userEmail", user.email);
        localStorage.setItem("userId", user.id);
        localStorage.setItem("isLoggedIn", "true");
        
        // Store user profile data
        if (user.user_metadata) {
          localStorage.setItem("userFullName", user.user_metadata.full_name || user.user_metadata.name || "");
          localStorage.setItem("userOfficeUnit", user.user_metadata.office_unit || "");
        }

        Swal.fire({
          icon: "success",
          title: "Account Created",
          text: `Welcome, ${user.user_metadata?.full_name || user.user_metadata?.name || user.email}!`,
          timer: 1500,
          showConfirmButton: false,
          background: "#fff",
          color: "#000",
          didClose: () => {
            window.location.href = "main.html";
          },
        });
      }
    });

    // Navigation between steps
    const step1 = document.getElementById("step1");
    const step2 = document.getElementById("step2");

    document.getElementById("next1").addEventListener("click", () => {
      const full_name = document.getElementById("full_name").value.trim();
      const age = document.getElementById("age").value;
      const office_unit = document.getElementById("office_unit").value.trim();
      const position = document.getElementById("position").value;

      if (!full_name || !age || !office_unit || !position) {
        Swal.fire({ icon: "warning", title: "Incomplete", text: "Please fill all fields.", confirmButtonColor: "#FFD700" });
        return;
      }
      step1.classList.remove("active");
      step2.classList.add("active");
    });

    document.getElementById("back1").addEventListener("click", () => {
      step2.classList.remove("active");
      step1.classList.add("active");
    });

    // Handle registration (Step 2 Submit)
    const form = document.getElementById("registerForm");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const full_name = document.getElementById("full_name").value.trim();
      const age = document.getElementById("age").value;
      const office_unit = document.getElementById("office_unit").value.trim();
      const position = document.getElementById("position").value;
      const birthday = document.getElementById("birthday").value;
      const contact = document.getElementById("contact").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      // Show loading
      Swal.fire({
        title: 'Creating Account...',
        text: 'Please wait while we process your registration.',
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
      });

      // Register user with Supabase Authentication
      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: {
          data: {
            full_name,
            age: parseInt(age),
            office_unit,
            position,
            birthday,
            contact
          },
          emailRedirectTo: window.location.origin + '/index.html'
        }
      });

      Swal.close();
      if (error) {
        Swal.fire({ 
          icon: "error", 
          title: "Registration Failed", 
          text: error.message, 
          confirmButtonColor: "#FFD700" 
        });
      } else {
        Swal.fire({
          icon: 'success',
          title: 'Registration Complete!',
          text: 'Your account has been created successfully. You can now log in.',
          confirmButtonColor: '#FFD700',
          confirmButtonText: 'Go to Login'
        }).then(() => {
          window.location.href = 'Untitled-1.html';
        });
      }
    });
  </script>
</body>
</html>
